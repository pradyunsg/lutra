name: Validation
on:
  push:
    branches:
    - main
  pull_request: {}
jobs:
  docs:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        os:
        - ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        allow-prereleases: true
    - run: pipx run nox --non-interactive -s docs --force-python ${{ matrix.python }}
    timeout-minutes: 30
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
